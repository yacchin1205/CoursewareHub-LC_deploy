name: Set up CoursewareHub Notebook tests
description: Install the controller, Ansible collections, and browser used by the runtime tests.
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: pip
        cache-dependency-path: tests/e2e/requirements.txt
    - shell: bash
      run: |
        python -m pip install -r tests/e2e/requirements.txt
        python -m ipykernel install --user --name python3
        ansible-galaxy collection install git+https://github.com/ansible-collections/ansible.posix.git,e54b8bf68f583f2324861a8cb113d4f1bb20f3de
        ansible-galaxy collection install git+https://github.com/ansible-collections/community.general.git,bbe4fa1a88a60db1000e18982849b4c54fa84fe0
        python -m playwright install --with-deps chromium
