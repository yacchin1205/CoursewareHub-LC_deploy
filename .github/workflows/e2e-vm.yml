name: CoursewareHub | Build, use and update (VMs)

on:
  push:
    branches: [feature/e2e-test]
    paths:
      - '.github/workflows/e2e-vm.yml'
      - '.github/actions/setup-coursewarehub-tests/**'
      - '.github/actions/setup-qemu-guests/**'
      - 'tests/e2e/**'
      - 'tests/notebooks/requirements.txt'
      - '!tests/e2e/operationhub-coursewarehub.sh'
      - '!tests/e2e/aws_guest_provider.py'
      - '!tests/e2e/operationhub_ui.py'
      - '!tests/e2e/requirements-aws.txt'
      - '!tests/e2e/run-operationhub-coursewarehub.py'
      - 'coursewarehub/**'
      - '!coursewarehub/D01_CoursewareHub用VMをAWSに作成.ipynb'

permissions:
  contents: read

concurrency:
  group: coursewarehub-vm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coursewarehub:
    name: Build, use, update | OS reboot, SELinux, Compose v1
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-coursewarehub-tests
      - uses: ./.github/actions/setup-qemu-guests
      - name: Run D01-D06 with OS reboot and verify CoursewareHub before and after O01
        run: bash tests/e2e/coursewarehub-vm.sh
      - name: Prepare VM evidence permissions
        if: always()
        run: |
          if [[ -d test-results/coursewarehub-vm ]]; then
            sudo chown -R "$(id -u):$(id -g)" test-results/coursewarehub-vm
          fi
      - name: Save VM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursewarehub-vm
          path: test-results/coursewarehub-vm/
          if-no-files-found: warn
          retention-days: 7
