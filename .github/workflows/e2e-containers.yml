name: Notebook validation and CoursewareHub E2E (containers)

on:
  push:
    branches: [feature/e2e-test]
    paths:
      - '.github/workflows/e2e-containers.yml'
      - '.github/actions/setup-coursewarehub-tests/**'
      - 'tests/e2e/**'
      - '!tests/e2e/operationhub-coursewarehub.sh'
      - '!tests/e2e/aws_guest_provider.py'
      - '!tests/e2e/operationhub_ui.py'
      - '!tests/e2e/requirements-aws.txt'
      - '!tests/e2e/run-operationhub-coursewarehub.py'
      - '!tests/e2e/coursewarehub-vm.sh'
      - 'coursewarehub/**'
      - '!coursewarehub/D01_CoursewareHub用VMをAWSに作成.ipynb'

permissions:
  contents: read

concurrency:
  group: coursewarehub-containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  notebook-preparation:
    name: On-prem D01 + D02 | SSH validation and inventory generation
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install Notebook and Ansible dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m ipykernel install --user --name python3
      - name: Run D01/D02 and verify SSH success, SSH rejection and generated inventory
        run: bash tests/e2e/notebook-preparation.sh
      - name: Save D01/D02 execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notebook-preparation
          path: test-results/notebook-preparation/
          if-no-files-found: warn
          retention-days: 7

  coursewarehub:
    name: Build, use, update | ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: legacy-2024
            scenario: Local authentication (2024 images)
          - platform: current-registry
            scenario: Custom image (registry + repo2docker)
          - platform: federation
            scenario: Federated authentication (SAML)
    env:
      CWH_E2E_PLATFORM: ${{ matrix.platform }}
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-coursewarehub-tests
      - name: Make room for CoursewareHub images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Run D01-D05, verify CoursewareHub and D06, update with O01 and verify again
        run: bash tests/e2e/coursewarehub-container.sh
      - name: Save construction, runtime and update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coursewarehub-${{ matrix.platform }}
          path: test-results/coursewarehub-container/
          if-no-files-found: warn
          retention-days: 7
