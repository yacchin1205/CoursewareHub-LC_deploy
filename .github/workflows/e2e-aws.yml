name: AWS Notebook E2E

on:
  push:
    branches: [feature/e2e-test]
    paths:
      - '.github/workflows/e2e-aws.yml'
      - '.github/actions/setup-coursewarehub-tests/**'
      - 'tests/e2e/**'
      - 'D01_OperationHubをAWSに構築.ipynb'
      - 'coursewarehub/**'
      - 'image/**'

permissions:
  contents: read

concurrency:
  group: aws-notebook-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  aws:
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-coursewarehub-tests
      - name: Install local AWS provider and VM tools
        run: |
          python -m pip install -r tests/e2e/requirements-aws.txt
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Execute AWS construction notebooks and test the constructed services
        run: bash tests/e2e/aws-notebook.sh
      - name: Prepare evidence permissions
        if: always()
        run: |
          if [[ -d test-results/aws-notebook ]]; then
            sudo chown -R "$(id -u):$(id -g)" test-results/aws-notebook
          fi
      - name: Save AWS construction and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aws-notebook-evidence
          path: test-results/aws-notebook/
          if-no-files-found: warn
          retention-days: 7
