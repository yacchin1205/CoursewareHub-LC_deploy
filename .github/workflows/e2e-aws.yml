name: OperationHub | Build, use and construct CoursewareHub

on:
  push:
    branches: [feature/e2e-test]
    paths:
      - '.github/workflows/e2e-aws.yml'
      - '.github/actions/setup-coursewarehub-tests/**'
      - '.github/actions/setup-qemu-guests/**'
      - 'tests/e2e/**'
      - 'tests/notebooks/requirements.txt'
      - 'D01_OperationHubをAWSに構築.ipynb'
      - 'coursewarehub/**'
      - 'image/**'

permissions:
  contents: read

concurrency:
  group: operationhub-coursewarehub-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operationhub-coursewarehub:
    name: Build, use, update | AWS API (Moto) + VMs
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-coursewarehub-tests
      - name: Install local AWS provider
        run: python -m pip install -r tests/e2e/requirements-aws.txt
      - uses: ./.github/actions/setup-qemu-guests
      - name: Build OperationHub, run AWS D01 in its kernel, verify CoursewareHub before and after O01
        run: bash tests/e2e/operationhub-coursewarehub.sh
      - name: Prepare evidence permissions
        if: always()
        run: |
          if [[ -d test-results/operationhub-coursewarehub ]]; then
            sudo chown -R "$(id -u):$(id -g)" test-results/operationhub-coursewarehub
          fi
      - name: Save AWS construction and runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: operationhub-coursewarehub
          path: test-results/operationhub-coursewarehub/
          if-no-files-found: warn
          retention-days: 7
