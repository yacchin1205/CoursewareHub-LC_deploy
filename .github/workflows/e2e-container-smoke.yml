name: Container Swarm and Notebook smoke

on:
  push:
    branches: [feature/e2e-test]
    paths:
      - '.github/workflows/e2e-container-smoke.yml'
      - 'tests/e2e/**'
      - 'coursewarehub/**'

permissions:
  contents: read

concurrency:
  group: container-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swarm:
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install Notebook and Ansible dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m ipykernel install --user --name python3
      - name: Run existing Notebooks and two-node Swarm experiment
        run: bash tests/e2e/container-smoke.sh
      - name: Save experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: container-swarm-evidence
          path: test-results/container-smoke/
          if-no-files-found: warn
          retention-days: 7

  nfs:
    if: github.repository == 'yacchin1205/CoursewareHub-LC_deploy'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tests/e2e/requirements.txt
      - name: Install Notebook and Ansible dependencies
        run: |
          python -m pip install -r tests/e2e/requirements.txt
          python -m ipykernel install --user --name python3
          ansible-galaxy collection install git+https://github.com/ansible-collections/ansible.posix.git,e54b8bf68f583f2324861a8cb113d4f1bb20f3de
          python -m playwright install --with-deps chromium
      - name: Make room for CoursewareHub images
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h
      - name: Build CoursewareHub and test the running service
        run: bash tests/e2e/nfs-notebook.sh
      - name: Save NFS experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nfs-notebook-evidence
          path: test-results/nfs-notebook/
          if-no-files-found: warn
          retention-days: 7
