name: On-premises | Build and use CoursewareHub
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: &e2e_paths ['tests/lc4ri/**', '.github/workflows/lc4ri-on-premises.yml', 'coursewarehub/**']
  push:
    branches: ['**']
    paths: *e2e_paths
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  on_premises:
    name: On-premises | ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - authentication: local
            scenario: Local login, Moodle LTI and custom images
          - authentication: federation
            scenario: SAML federation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./tests/lc4ri/on-premises
        with:
          authentication: ${{ matrix.authentication }}
